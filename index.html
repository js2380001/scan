<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>工具管理系統 - 即時鏡頭掃碼</title>
  <script>
    (function() {
      var s = document.createElement('script');
      var rawSrc = "https://cdn" + "[點]" + "jsdelivr" + "[點]" + "net/npm/jsqr@1" + "[點]" + "4" + "[點]" + "0/dist/jsQR" + "[點]" + "min" + "[點]" + "js";
      s.src = rawSrc.replace(/\[點\]/g, '.');
      document.head.appendChild(s);
    })();
  </script>

    <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100dvh; /* 自動適應手機瀏覽器扣除網址列後的實際可視高度 */
      margin: 0;
      padding: 0;
      overflow: hidden; /* 防止頁面產生捲軸 */
      background: #f5f7fa;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 14px 14px;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 17px;
      flex-shrink: 0;
    }
    h3 small {
      font-size: 12px;
      font-weight: 600;
      color: #1a73e8;
      background: #e8f0fe;
      padding: 2px 7px;
      border-radius: 999px;
      vertical-align: middle;
    }

    /* 鏡頭區塊：自動吃掉所有剩餘高度，絕不把下方按鈕擠出螢幕 */
    .cam-box {
      position: relative;
      width: 100%;
      max-width: 400px;
      flex: 1 1 auto;   /* 自動填滿剩餘空間 */
      min-height: 140px; /* 確保在極小螢幕仍有基本可視高度 */
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 填滿掃描框，確保螢幕中央瞄準框與實際裁切區域 100% 對齊 */
    }
    video {
      display: block;
    }
    canvas {
      display: none;
    }

    /* 類似 LINE 的中央掃描瞄準框與周邊暗角遮罩 */
    .scan-guide-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    .scan-guide-box {
      position: relative;
      width: 65%;
      aspect-ratio: 1 / 1;
      max-width: 220px;
      max-height: 220px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
    }
    .scan-guide-box::before,
    .scan-guide-box::after,
    .scan-guide-corners::before,
    .scan-guide-corners::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #06C755;
      border-style: solid;
      border-width: 0;
    }
    .scan-guide-box::before { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 6px; }
    .scan-guide-box::after { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 6px; }
    .scan-guide-corners { position: absolute; inset: 0; }
    .scan-guide-corners::before { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 6px; }
    .scan-guide-corners::after { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 6px; }
    .scan-guide-line {
      position: absolute;
      left: 6%;
      width: 88%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #06C755, transparent);
      box-shadow: 0 0 8px #06C755;
      animation: lineScanMove 2s infinite ease-in-out;
    }
    @keyframes lineScanMove {
      0% { top: 8%; }
      50% { top: 90%; }
      100% { top: 8%; }
    }


    /* 下方資訊卡與按鈕區：固定高度不壓縮、不溢出 */
    .card {
      width: 100%;
      max-width: 400px;
      margin: 8px auto 0;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      text-align: left;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-all;
      flex-shrink: 0;
    }
    .label {
      font-size: 11px;
      color: #5f6368;
      margin-bottom: 2px;
    }

    button {
      padding: 10px 16px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      background: #6c757d;
      opacity: 0.65;
      cursor: not-allowed;
    }
    .action-btn-row {
      width: 100%;
      max-width: 400px;
      margin: 10px auto 0;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-cancel-scan {
      flex: 1;
      margin-top: 0;
      padding: 11px 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      background-color: #198754;
      color: #ffffff;
    }
    .btn-confirm-send {
      flex: 1;
      margin-top: 0;
      padding: 11px 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      background-color: #0d6efd;
      color: #ffffff;
    }
    .btn-confirm-send:disabled {
      background-color: #6c757d;
      color: #ffffff;
      opacity: 0.65;
    }
    .btn-rescan {
      width: 100%;
      max-width: 400px;
      margin: 8px auto 0;
      padding: 11px 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      background-color: #dc3545;
      color: #ffffff;
      flex-shrink: 0;
    }
  </style>

</head>
<body>

   <h3>即時鏡頭 QR-CODE 掃描</h3>

  <div class="cam-box">
    <video id="camVideo" playsinline autoplay muted></video>
    <canvas id="scanCanvas"></canvas>
    <div id="scanGuideOverlay" class="scan-guide-overlay">
      <div class="scan-guide-box">
        <div class="scan-guide-corners"></div>
        <div class="scan-guide-line"></div>
      </div>
    </div>
  </div>


  <div class="card">
    <div class="label">目前狀態</div>
    <div id="statusText">正在啟動後置鏡頭...</div>
  </div>

   <div class="card">
    <div class="label">最近解碼內容</div>
    <div id="decodedText">尚未掃描</div>
  </div>

  <div class="action-btn-row">
    <button id="cancelScanBtn" type="button" class="btn-cancel-scan" onclick="cancelAndReturnPrev()">取消掃碼</button>
    <button id="confirmSendBtn" type="button" class="btn-confirm-send" onclick="confirmAndSendToGas()" disabled>確認送出</button>
  </div>

  <button id="rescanBtn" type="button" class="btn-rescan" style="display:none;" onclick="initCamera()">重新掃描</button>




  <script>



   // const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz1QPvI9ik-xDUKntAV9pYVnm5I0JERCmTrdx0MXRDBiaOgH_zO96re1Lu_aO7lx7xj/exec';

    const videoEl = document.getElementById('camVideo');



    const canvasEl = document.getElementById('scanCanvas');
    const ctx = canvasEl.getContext('2d', { willReadFrequently: true });



    let mediaStream = null;
    let rafId = null;
    let isScanning = false;
    let isSending = false;
    let pendingDecodedText = '';

    function setConfirmBtnEnabled(enabled) {
      const btn = document.getElementById('confirmSendBtn');
      if (btn) {
        btn.disabled = !enabled;
      }
    }






    function setStatus(msg) {
      document.getElementById('statusText').innerText = msg;
    }

    function setDecoded(text) {
      const el = document.getElementById('decodedText');
      if (!el) return;
      el.innerText = text;
      if (text && text !== '尚未掃描') {
        el.style.setProperty('color', '#dc3545', 'important');
        el.style.setProperty('font-size', '20px', 'important');
        el.style.setProperty('font-weight', '900', 'important');
      } else {
        el.style.setProperty('color', '#202124', 'important');
        el.style.setProperty('font-size', '14px', 'important');
        el.style.setProperty('font-weight', 'normal', 'important');
      }
    }


    function setRescanVisible(visible, disabled = false) {
      const btn = document.getElementById('rescanBtn');
      btn.style.display = visible ? 'inline-block' : 'none';
      btn.disabled = disabled;
    }

    function getDeviceInfo() {
      const ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
      if (/Android/i.test(ua)) return 'Android';
      return 'Other';
    }

    function stopScanLoop() {
      isScanning = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

       function stopCameraStream(keepFrozenFrame) {
      stopScanLoop();
      const guideEl = document.getElementById('scanGuideOverlay');
      if (keepFrozenFrame && canvasEl && canvasEl.width > 0) {
        // 定格時將完整畫面畫回 canvas 呈現，並隱藏掃描動態線條
        if (videoEl && videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
          canvasEl.width = videoEl.videoWidth;
          canvasEl.height = videoEl.videoHeight;
          ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
        }
        if (guideEl) guideEl.style.display = 'none';
        canvasEl.style.display = 'block';
        videoEl.style.display = 'none';
      } else {
        if (guideEl) guideEl.style.display = 'flex';
        if (canvasEl) canvasEl.style.display = 'none';
        if (videoEl) videoEl.style.display = 'block';
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      videoEl.srcObject = null;
    }


    async function initCamera() {
      stopCameraStream(false);
      pendingDecodedText = '';
      setConfirmBtnEnabled(false);
      setDecoded('尚未掃描', false);
      setRescanVisible(false);
      setStatus('正在請求相機權限並啟動後置鏡頭...');





      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('此瀏覽器不支援相機串流');
        setRescanVisible(true, false);
        return;
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
      } catch (err) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
        } catch (fallbackErr) {
          setStatus('無法啟動鏡頭：' + (fallbackErr.name || 'Error') + ' - ' + (fallbackErr.message || fallbackErr));
          setRescanVisible(true, false);
          return;
        }
      }

      videoEl.srcObject = mediaStream;
      await videoEl.play();
      startScanLoop();
    }

        function startScanLoop() {
      if (isSending) return;
      stopScanLoop();
      isScanning = true;
      setRescanVisible(false);
      setStatus('鏡頭已啟動，請將 QR Code 對準綠色框內');

      const tick = () => {
        if (!isScanning || isSending) return;

        if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA && videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
          const vw = videoEl.videoWidth;
          const vh = videoEl.videoHeight;

          // 計算螢幕實際顯示與原始視訊的比例，精準對應中央 65% 綠色瞄準框範圍
          const boxRect = videoEl.getBoundingClientRect();
          const scale = Math.max(boxRect.width / vw, boxRect.height / vh);
          const visibleW = boxRect.width / scale;
          const visibleH = boxRect.height / scale;
          const cropSize = Math.floor(Math.min(visibleW, visibleH) * 0.65);
          const cropX = Math.floor((vw - cropSize) / 2);
          const cropY = Math.floor((vh - cropSize) / 2);

          if (cropSize > 0) {
            canvasEl.width = cropSize;
            canvasEl.height = cropSize;
            ctx.drawImage(videoEl, cropX, cropY, cropSize, cropSize, 0, 0, cropSize, cropSize);

            const imageData = ctx.getImageData(0, 0, cropSize, cropSize);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'attemptBoth'
            });

            if (code && code.data) {
              handleDecoded(code.data);
              return;
            }
          }
        }

        rafId = requestAnimationFrame(tick);
      };

      rafId = requestAnimationFrame(tick);
    }


    function handleDecoded(decodedText) {
      if (isSending) return;
      stopCameraStream(true);

      const cleanText = String(decodedText || '').trim();
      pendingDecodedText = cleanText;
      setDecoded(cleanText, true);
      setConfirmBtnEnabled(true);
      setRescanVisible(true, false);

      // 向主系統查詢此 QR Code 對應的 Tools 工作頁資訊（工具分類、工具名稱、工具編號）
      const targetWin = window.opener || (window.parent !== window ? window.parent : null);
      if (targetWin) {
        setStatus('掃描解析完成！正在核對工具資料... ⏳');
        try {
          targetWin.postMessage({
            type: 'QUERY_TOOL_INFO_BY_QR',
            decodedText: cleanText
          }, '*');
        } catch (e) {
          setStatus('掃描解析完成！請核對上方內容後按下「確認送出」');
        }
      } else {
        setStatus('掃描解析完成！請核對上方內容後按下「確認送出」');
      }
    }



    function confirmAndSendToGas() {
      if (isSending || !pendingDecodedText) return;
      isSending = true;
      setConfirmBtnEnabled(false);

      const textToSend = pendingDecodedText;
      pendingDecodedText = '';

      try {
        const targetWin = window.opener || (window.parent !== window ? window.parent : null);
        if (targetWin) {
          targetWin.postMessage({
            type: 'QR_SCAN_RESULT',
            decodedText: textToSend,
            deviceInfo: getDeviceInfo()
          }, '*');
          setStatus('資料已送出至主系統，視窗即將關閉...');
          setTimeout(function() {
            window.close();
          }, 300);
        } else {
          setStatus('找不到主系統視窗，請手動切回原分頁');
          isSending = false;
        }
      } catch (err) {
        setStatus('傳回主系統失敗：' + (err && err.message ? err.message : err));
        isSending = false;
      }
    }

    function cancelAndReturnPrev() {
      stopCameraStream();
      pendingDecodedText = '';
      isSending = false;
      setConfirmBtnEnabled(false);
      setDecoded('尚未掃描');
      setStatus('已取消掃碼，正在返回上一畫面...');

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.focus();
        } catch (e) {}
        window.close();
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
      }
    }





    window.addEventListener('message', function(event) {
      if (!event || !event.data) return;
      if (event.data.type === 'RESTART_CAMERA') {
        initCamera();
      } else if (event.data.type === 'STOP_CAMERA') {
        stopCameraStream();
      } else if (event.data.type === 'TOOL_INFO_RESULT') {
        // 確認回傳的是目前這筆剛掃描的條碼結果，避免非同步錯位
        if (event.data.decodedText !== pendingDecodedText) return;
        const statusEl = document.getElementById('statusText');
        if (!statusEl) return;

        if (event.data.found) {
          statusEl.innerHTML =
            '<div style="font-weight:bold; color:#198754; margin-bottom:2px;">✅ 掃描解析完成(請核對後[確認送出]或[重新掃描]）：</div>' +
            '<div style="font-size:14px; font-weight:bold; color:#202124;">' +
              '分類：<span style="color:#0d6efd;">' + event.data.category + '</span>' +
              '<br>名稱：<span style="color:#0d6efd;">' + event.data.name + '</span>' +
              '<br>編號：<span style="color:#0d6efd;">' + event.data.toolId + '</span>' +
            '</div>';
        } else {
          statusEl.innerHTML = '<span style="color:#dc3545; font-weight:bold;">⚠️ 查無此工具資料（非本系統 QR-CODE），請按「重新掃描」</span>';
        }
      }
    });


    window.addEventListener('DOMContentLoaded', initCamera);
    window.addEventListener('beforeunload', stopCameraStream);
 
  </script>
</body>
</html>
